name: WEBUY location truth + SEO regression

on:
  pull_request:
    paths:
      - 'src/lib/build-location-page.ts'
      - 'src/components/pages/LocationView.tsx'
      - 'src/components/pages/HomePage.tsx'
      - 'src/lib/location-editorial.ts'
      - 'src/lib/seoLocation.ts'
      - 'src/lib/jsonld.ts'
      - 'src/pages/locations/index.astro'
      - 'scripts/qa-location-truth.mjs'
      - '.github/workflows/location-truth-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  location-truth:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Build all static paths
        run: npm run build
      - name: Verify three editorial pages and SEO invariants
        run: node scripts/qa-location-truth.mjs
